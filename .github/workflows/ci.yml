name: Tests

on:
  push:
  pull_request:

jobs:
  lint:
    runs-on: ubuntu-latest
    steps:
      - name: Checkout
        uses: actions/checkout@11bd71901bbe5b1630ceea73d27597364c9af683 # v4.2.2

      - name: Setup Python
        uses: actions/setup-python@a26af69be951a213d495a4c3e4e4022e16d87065 # v5.6.0
        with:
          python-version: '3.10'

      - name: Install linters
        run: |
          python -m pip install --upgrade pip==25.0.1
          pip install black==24.10.0 isort==5.13.2 flake8==7.1.1

      - name: Run black
        run: black --check .

      - name: Run isort
        run: isort --check-only .

      - name: Run flake8
        run: flake8 .

      - name: Run JavaScript smoke tests
        run: |
          node --check tests/test_lightbox_overrides.js
          node --check tests/test_justified_lifecycle.js
          node --check tests/test_justified_layout.js
          node --check tests/test_lightbox_runtime.js
          node --check tests/test_lightbox_api.js
          node --check scripts/verify_lightbox_assets.js
          node tests/test_lightbox_overrides.js
          node tests/test_justified_lifecycle.js
          node tests/test_justified_layout.js
          node tests/test_lightbox_runtime.js
          node tests/test_lightbox_api.js
          node scripts/verify_lightbox_assets.js

  tests:
    runs-on: ubuntu-latest
    strategy:
      fail-fast: false
      matrix:
        include:
          - name: django32-cms311
            python: '3.10'
            django: '>=3.2,<3.3'
            cms: '>=3.11,<3.12'
          - name: django42-cms41
            python: '3.10'
            django: '>=4.2,<4.3'
            cms: '>=4.1,<4.2'
          - name: django42-cms50
            python: '3.10'
            django: '>=4.2,<4.3'
            cms: '>=5.0,<5.1'
    steps:
      - name: Checkout
        uses: actions/checkout@11bd71901bbe5b1630ceea73d27597364c9af683 # v4.2.2

      - name: Setup Python
        uses: actions/setup-python@a26af69be951a213d495a4c3e4e4022e16d87065 # v5.6.0
        with:
          python-version: ${{ matrix.python }}

      - name: Install system deps
        run: |
          sudo apt-get update
          sudo apt-get install -y gettext

      - name: Install test dependencies
        run: |
          python -m pip install --upgrade pip==25.0.1
          pip install \
            "Django${{ matrix.django }}" \
            "django-cms${{ matrix.cms }}" \
            django-filer \
            django-mptt \
            easy-thumbnails \
            django-sekizai \
            pytest==8.3.5 pytest-django==4.11.1

      - name: Run tests
        env:
          DJANGO_SETTINGS_MODULE: tests.settings
          PYTHONPATH: "${{ github.workspace }}:${{ github.workspace }}/tests"
        run: pytest -q

  dependency-audit:
    runs-on: ubuntu-latest
    steps:
      - name: Checkout
        uses: actions/checkout@11bd71901bbe5b1630ceea73d27597364c9af683 # v4.2.2

      - name: Setup Python
        uses: actions/setup-python@a26af69be951a213d495a4c3e4e4022e16d87065 # v5.6.0
        with:
          python-version: '3.10'

      - name: Install audit environment
        run: |
          python -m pip install --upgrade pip==26.1.2 setuptools==83.0.0
          pip install \
            "Django>=4.2,<4.3" \
            "django-cms>=4.1,<4.2" \
            django-filer \
            django-mptt \
            easy-thumbnails \
            django-sekizai \
            pip-audit==2.7.3

      - name: Audit dependencies
        run: pip-audit --strict --progress-spinner off
