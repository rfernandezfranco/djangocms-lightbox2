stages: [mirror]

mirror_from_github:
  stage: mirror
  image: alpine:3.19
  variables:
    GIT_STRATEGY: none
  script:
    - apk add --no-cache git ca-certificates
    - awk 'BEGIN{c=0}/-----BEGIN CERTIFICATE-----/{c++} {print > ("/usr/local/share/ca-certificates/gitlab-" c ".crt")}' "$GITLAB_CA_PEM"
    - update-ca-certificates
    # GITHUB_TOKEN and GITLAB_PUSH_TOKEN must be masked and protected CI variables.
    - git -c credential.helper='!f() { echo username=x-access-token; echo password="$GITHUB_TOKEN"; }; f' clone --mirror "https://github.com/rfernandezfranco/djangocms-lightbox2.git" repo.git
    - cd repo.git
    - git -c credential.helper='!f() { echo username=oauth2; echo password="$GITLAB_PUSH_TOKEN"; }; f' push --mirror "${CI_SERVER_URL}/${CI_PROJECT_PATH}.git"
  rules:
    - if: '$CI_PIPELINE_SOURCE == "schedule"'
